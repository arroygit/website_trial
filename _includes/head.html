<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | prepend: site.url}}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="shortcut icon" href="{{ site.url }}{{ site.baseurl }}/images/logopic/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  {% if jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}

  <!-- 1. INSTANT THEME INITIALIZATION (Prevents lag and manual refreshes) -->
  <script>
    (function() {
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      } else if (currentTheme === 'light') {
        document.documentElement.classList.remove('dark-theme');
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <!-- 2. Dark Mode Styles -->
  <style>
    /* Default variables */
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
    }

    /* Core Dark Mode Color Assignment */
    html.dark-theme, body.dark-theme {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Force global typography items to invert cleanly */
    html.dark-theme p, 
    html.dark-theme h1, 
    html.dark-theme h2, 
    html.dark-theme h3, 
    html.dark-theme h4, 
    html.dark-theme h5, 
    html.dark-theme h6, 
    html.dark-theme li, 
    html.dark-theme span,
    html.dark-theme td,
    html.dark-theme th {
      color: var(--text-color) !important;
    }

    /* EXTENDED & AGGRESSIVE CARD FIXES */
    html.dark-theme .thumbnail,
    html.dark-theme .card,
    html.dark-theme .caption,
    html.dark-theme .well,
    html.dark-theme .panel,
    html.dark-theme [class*="card-"],
    html.dark-theme [class*="thumbnail-"] {
      background-color: #1f1f1f !important;
      background: #1f1f1f !important;
      border: 1px solid #333333 !important;
      color: var(--text-color) !important;
    }

    html.dark-theme .thumbnail *,
    html.dark-theme .card *,
    html.dark-theme .caption * {
      color: var(--text-color) !important;
    }

    /* 🟢 RE-ENGINEERED FOOTER DARK MODE FIXES 
       This targets any potential container block inside the footer include file */
    html.dark-theme footer,
    html.dark-theme .footer,
    html.dark-theme #footer,
    html.dark-theme .navbar-fixed-bottom,
    html.dark-theme body > div:last-of-type,
    html.dark-theme body > footer:last-child {
      background-color: #121212 !important;
      background: #121212 !important;
      border-top: 1px solid #222222 !important;
      color: var(--text-color) !important;
    }

    /* Force all layout items nested inside the footer to stay readable */
    html.dark-theme footer *,
    html.dark-theme .footer *,
    html.dark-theme #footer *,
    html.dark-theme body > div:last-of-type * {
      color: var(--text-color) !important;
    }

    /* Bright vibrant blue links specifically for footer navigation elements */
    html.dark-theme footer a,
    html.dark-theme .footer a,
    html.dark-theme #footer a,
    html.dark-theme body > div:last-of-type a {
      color: #4da6ff !important;
    }
    html.dark-theme footer a:hover,
    html.dark-theme .footer a:hover,
    html.dark-theme #footer a:hover,
    html.dark-theme body > div:last-of-type a:hover {
      color: #80bfff !important;
    }

    /* Link readability configuration for the rest of the site content */
    html.dark-theme a {
      color: #4da6ff;
    }
    html.dark-theme a:hover {
      color: #80bfff;
    }

    /* Bootstrap Specific Navigation Bar Styling Overrides */
    html.dark-theme .navbar-default, body.dark-theme .navbar-default {
      background-color: var(--bg-color) !important;
      border-color: #222222 !important;
    }
    html.dark-theme .navbar-default .navbar-nav > li > a, body.dark-theme .navbar-default .navbar-nav > li > a {
      color: var(--text-color) !important;
    }
    html.dark-theme .navbar-default .navbar-brand, body.dark-theme .navbar-default .navbar-brand {
      color: var(--text-color) !important;
    }
    
    /* Dropdown Menus inside Navbar */
    html.dark-theme .dropdown-menu, body.dark-theme .dropdown-menu {
      background-color: #1f1f1f !important;
      border-color: #333333 !important;
    }
    html.dark-theme .dropdown-menu > li > a, body.dark-theme .dropdown-menu > li > a {
      color: #f5f5f5 !important;
    }
    html.dark-theme .dropdown-menu > li > a:hover, body.dark-theme .dropdown-menu > li > a:hover {
      background-color: #333333 !important;
    }
  </style>

</head>
