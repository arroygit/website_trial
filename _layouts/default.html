<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    {% include header.html %}

    <div class="container-fluid">
      <div class="row">
        {{ content }}
      </div>
    </div>

    {% include footer.html %}

    <script>
      const toggleButton = document.getElementById('theme-toggle');

      // 🟢 The head script handles the initial load, so this script only 
      // needs to safely listen for click events on the button.
      if (toggleButton) {
          toggleButton.addEventListener('click', () => {
              // Target documentElement (<html>) to instantly sync with your CSS rules
              document.documentElement.classList.toggle('dark-theme');
              
              let theme = 'light';
              if (document.documentElement.classList.contains('dark-theme')) {
                  theme = 'dark';
              }
              localStorage.setItem('theme', theme);
          });
      }
    </script>

  </body>
</html>
