  description:  "In this line of research, we aim to develop efficient coherent light sources and amplifiers required to address atomic transitions with the requisite linewidth and frequency referencing. We aim to develop photonic modulators required for laser pulse shaping that is needed for performing quantum operations involving atomic transitions."
