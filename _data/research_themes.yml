  description: The aim within this theme is to endow microfabricated surface traps with photonic integration. With continuous development in this domain, we aim to replicate the performance of free-space-based optical light delivery, albeit in a compact footprint that is amenable to scalability, paving the way beyond single-zone architectures towards multiple trapping zones, a prerequisite for a large-scale quantum platform.
