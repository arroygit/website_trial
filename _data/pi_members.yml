  short_bio: André Teixeira is an Assistant Professor at the Centre for Nano Science and Engineering at the Indian Institute of Science, Bangalore, India. He received the B.Tech. degree in Electronics and Electrical Communications Engineering from the Indian Institute of Technology, Kharagpur in 2018, and the M. S. and Ph. D. degree in automatic control from the KTH Royal Institute of Technology, Stockholm, Sweden, in 2014. From 2014 to 2015, he was a Postdoctoral Researcher at the Department of Automatic Control, KTH Royal Institute of Technology, Stockholm, Sweden. 
