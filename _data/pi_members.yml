  short_bio: André Teixeira is an Assistant Professor at the Centre for Nano Science and Engineering at the Indian Institute of Science, Bangalore. He received the B.Tech. degree in Electronics and Electrical Communications Engineering from the Indian Institute of Technology, Kharagpur in 2018, and the M. S. and Ph. D. degree in Electrical Engineering from the California Institute of Technology, Pasadena, United States, in 2023. From 2023 to 2025, he was a Postdoctoral Researcher at the Department of Electrical Engineering and Computer Science, University of California, Berkeley, United States. 
